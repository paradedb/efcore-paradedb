# workflows/ci.yml
#
# CI
# Run linting and test matrix across supported .NET versions.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: CSharpier format check
        run: dotnet csharpier check .

      - name: Restore
        run: dotnet restore build.slnf

      - name: Verify build (no warnings)
        run: dotnet build build.slnf --configuration Release --no-restore -warnaserror

      - name: Package install smoke test
        run: bash scripts/smoke_package_install.sh

  build:
    name: .NET ${{ matrix.framework }} / PG ${{ matrix.postgres-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - dotnet: "8.0.x"
            framework: "net8.0"
            postgres-version: "18"
          - dotnet: "9.0.x"
            framework: "net9.0"
            postgres-version: "18"
          - dotnet: "10.0.x"
            framework: "net10.0"
            postgres-version: "18"
          - dotnet: "10.0.x"
            framework: "net10.0"
            postgres-version: "15"
          - dotnet: "10.0.x"
            framework: "net10.0"
            postgres-version: "16"
          - dotnet: "10.0.x"
            framework: "net10.0"
            postgres-version: "17"

    services:
      paradedb:
        image: paradedb/paradedb:0.26.0-pg${{ matrix.postgres-version }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    env:
      PARADEDB_TEST_DSN: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ matrix.dotnet }}

      - name: Restore
        run: dotnet restore build.slnf

      - name: Build
        run: dotnet build build.slnf --configuration Release --framework ${{ matrix.framework }} --no-restore

      - name: Test
        run: |
          dotnet test \
            --no-build \
            --configuration Release \
            --framework ${{ matrix.framework }} \
            --results-directory TestResults/${{ matrix.framework }} \
            --coverlet \
            --coverlet-output-format cobertura

      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          directory: TestResults/${{ matrix.framework }}
          flags: ${{ matrix.framework }},pg${{ matrix.postgres-version }}
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  windows-smoke:
    name: Windows Smoke
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore build.slnf -p:TargetFramework=net10.0

      - name: Build
        run: dotnet build build.slnf --configuration Release --framework net10.0 --no-restore

  check-api-coverage:
    name: Check API Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      - name: Check API coverage
        run: uv run --with json5 scripts/check_api_coverage.py

      - name: Test tooling scripts
        run: uv run --with json5 python -m unittest discover -s scripts/tests -p "test_*.py"
