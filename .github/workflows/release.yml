# workflows/release.yml
#
# Release
# Build, publish, and release efcore-paradedb from a validated version.

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (semver, e.g., 0.1.0)."
        type: string
        required: true
      beta:
        description: "Mark this as a prerelease"
        type: boolean
        default: false
      confirmation:
        description: "I confirm version bump, changelog update, and green CI."
        type: boolean
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: 10.0.x

permissions:
  contents: write

jobs:
  release:
    name: Build and Publish to NuGet
    runs-on: ubuntu-latest

    env:
      PACKAGES_OUTPUT_DIR: ${{ github.workspace }}/packages

    steps:
      - name: Validate confirmation
        if: ${{ github.event.inputs.confirmation != 'true' }}
        run: |
          echo "Please confirm the release checklist first."
          exit 1

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Validate version
        env:
          VERSION: ${{ github.event.inputs.version }}
          BETA: ${{ github.event.inputs.beta }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if ! [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: ${VERSION}"
            exit 1
          fi

          if [[ "${BETA}" == "true" && "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Beta releases must have a prerelease suffix (e.g., 0.1.0-rc.1)"
            exit 1
          fi

          if git ls-remote --tags origin "refs/tags/v${VERSION}" | grep -q "refs/tags/v${VERSION}$"; then
            echo "Tag v${VERSION} already exists."
            exit 1
          fi

          if gh release view "v${VERSION}" > /dev/null 2>&1; then
            echo "GitHub release v${VERSION} already exists."
            exit 1
          fi

          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "Version validation passed for ${VERSION}"

      - name: Determine if latest
        id: latest
        env:
          BETA: ${{ github.event.inputs.beta }}
        run: |
          set -euo pipefail
          git fetch --depth=1 --no-tags origin "+refs/tags/v*:refs/tags/v*"
          IS_LATEST=$(python3 - <<'PYTHON'
          import os
          import re
          import subprocess

          def stable_version(value):
              match = re.fullmatch(r"v?([0-9]+)\.([0-9]+)\.([0-9]+)", value)
              return tuple(map(int, match.groups())) if match else None

          target = stable_version(os.environ["VERSION"])
          if os.environ["BETA"] == "true":
              print("false")
          elif target is None:
              raise SystemExit("Non-beta releases must use a stable major.minor.patch version")
          else:
              tags = subprocess.check_output(["git", "tag", "-l", "v*"], text=True)
              versions = [version for tag in tags.splitlines() if (version := stable_version(tag))]
              print("true" if not versions or target >= max(versions) else "false")
          PYTHON
          )
          echo "is_latest=${IS_LATEST}" >> "$GITHUB_OUTPUT"

      - name: Build package
        run: |
          set -euo pipefail
          dotnet pack src/ParadeDB.EntityFrameworkCore.csproj \
            --configuration Release \
            --output "${PACKAGES_OUTPUT_DIR}" \
            -p:PackageVersion="${VERSION}"
          ls -l "${PACKAGES_OUTPUT_DIR}"

      - name: Publish to NuGet
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          dotnet nuget push "${PACKAGES_OUTPUT_DIR}"/*.nupkg \
            --api-key "${NUGET_API_KEY}" \
            --source https://api.nuget.org/v3/index.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ github.event.inputs.beta }}
          make_latest: ${{ steps.latest.outputs.is_latest }}
          generate_release_notes: true
          files: ${{ env.PACKAGES_OUTPUT_DIR }}/*.nupkg
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Summary
        run: |
          {
            echo "## Released v${VERSION}"
            echo
            echo "- NuGet: \`ParadeDB.EntityFrameworkCore ${VERSION}\` published"
            echo "- GitHub tag: \`v${VERSION}\` created from ${GITHUB_SHA}"
            echo "- GitHub release: created and package attached"
          } >> "${GITHUB_STEP_SUMMARY}"
